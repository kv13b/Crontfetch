name: Keep app awake

# Render's free tier sleeps the app after 15 minutes with no requests, which
# would pause the background job-sync loop too. Pinging /health more often
# than that keeps it awake so notifications keep firing on schedule.
#
# GitHub doesn't guarantee a scheduled workflow runs at the exact minute —
# it can be a few minutes late under load — so this runs every 10 minutes
# to leave a safety margin under Render's 15-minute sleep timer.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab, to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "${{ vars.APP_URL }}" ]; then
            echo "APP_URL repository variable is not set."
            echo "Set it in: repo Settings > Secrets and variables > Actions > Variables"
            echo "to your deployed app's URL, e.g. https://crontfetch.onrender.com"
            exit 1
          fi
          curl -sf "${{ vars.APP_URL }}/health"
